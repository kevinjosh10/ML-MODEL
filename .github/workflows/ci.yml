name: Tamil Speech Emotion Recognition CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Test & Validate Web Pipeline
    runs-on: ubuntu-latest

    steps:
    - name: ⬇️ Checkout Repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: 📦 Install PyTorch & Audio Dependencies
      run: |
        python -m pip install --upgrade pip
        # Install CPU-optimized PyTorch for lightning-fast CI runs
        pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt
        pip install pytest httpx

    - name: 🧪 Run Unit & Endpoint Test Suite
      run: |
        pytest tests/ -v

    - name: 🏋️ Run Quick Training Pipeline Verification
      run: |
        python train.py --epochs 2 --batch-size 8

    - name: 🌐 Verify FastAPI Server Startup
      run: |
        python -c "import app; print('FastAPI app initialized successfully:', app.app.title)"
